# Smoke test: cheapest GPU with ≥16 GB, run nvidia-smi and a tiny script, bring two files back.
# Expected cost: a few cents. Try it free first:  gpu-ops run examples/smoke/job.toml --dry-run

name = "smoke"
project = "gpu-ops"
kind = "other"

[image]
# python:3.12-slim, pinned 2026-11-11 with `gpu-ops pin-image python:3.12-slim`
ref = "docker.io/library/python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b"

[run]
command = "nvidia-smi | tee $GPUOPS_OUT/nvidia-smi.txt && python $GPUOPS_IN/code/hello.py"
disk_gb = 20

[[inputs]]
name = "code"
from = "."
include = ["hello.py"]

[[outputs]]
path = "nvidia-smi.txt"

[[outputs]]
path = "hello.json"

[gpu]
min_vram_gb = 16

[limits]
max_minutes = 20
max_cost_usd = 0.20
