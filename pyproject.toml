[project]
name = "gpu-ops"
version = "0.1.0"
description = "Rent a cloud GPU, run a job, bring results home, shut it down."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
gpu-ops = "gpu_ops.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
